name: QA Pillars

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: qa-pillars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-pillars:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potterymania_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d potterymania_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      BASE_URL: "http://127.0.0.1:3000"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/potterymania_ci?schema=public"
      AUTH_SECRET: "ci-auth-secret-not-for-production"
      AUTH_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
      CRON_SECRET: "ci-cron-secret"
      RESEND_API_KEY: ""
      RESEND_FROM: "PotteryMania <onboarding@resend.dev>"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Functionality pillar
        run: npm run test:functionality

      - name: API contract checks
        run: npm run test:api-contract

      - name: Performance pillar
        run: npm run test:performance

      - name: Reconciliation pillar
        run: npm run test:reconciliation

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Upload QA evidence directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa/evidence
          if-no-files-found: warn
