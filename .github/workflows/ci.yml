# Fast checks on every push to `main` — intended as the Railway "Wait for CI" gate.
# Heavy Playwright / pillar runs stay in `qa-pillars.yml` (PR + manual + schedule).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potterymania_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d potterymania_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/potterymania_ci?schema=public"
      AUTH_SECRET: "ci-auth-secret-not-for-production"
      AUTH_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
      CRON_SECRET: "ci-cron-secret"
      RESEND_API_KEY: ""
      RESEND_FROM: "PotteryMania <onboarding@resend.dev>"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # region agent log
      - name: Prisma preflight
        shell: bash
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL); console.log(JSON.stringify({hypothesisId:'H_CI_PREFLIGHT', host:u.hostname, port:u.port, database:u.pathname.slice(1), hasAuthSecret:Boolean(process.env.AUTH_SECRET), hasDatabaseUrl:Boolean(process.env.DATABASE_URL), ts:Date.now()}));"
          pg_isready -h localhost -p 5432 -U postgres -d potterymania_ci
          printf 'SELECT 1;\n' | npx prisma db execute --stdin --url "$DATABASE_URL"
      # endregion

      # region agent log
      - name: Prisma migrate
        shell: bash
        run: |
          set +e
          npx prisma migrate deploy 2>&1 | tee prisma-migrate.log
          status=${PIPESTATUS[0]}
          echo "PRISMA_MIGRATE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit $status

      - name: Prisma migrate diagnostics
        if: failure()
        shell: bash
        run: |
          echo '{"hypothesisId":"H_CI_MIGRATE_FAIL","message":"prisma migrate deploy failed; collecting diagnostics"}'
          if [ -f prisma-migrate.log ]; then
            echo '--- prisma migrate log ---'
            cat prisma-migrate.log
            head_summary="$(head -c 900 prisma-migrate.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            tail_summary="$(tail -c 1400 prisma-migrate.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Prisma migrate stderr (head)::$head_summary"
            echo "::error title=Prisma migrate stderr (tail)::$tail_summary"
          fi
          npx prisma migrate status || true
          npx prisma validate || true
      # endregion

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:ci
