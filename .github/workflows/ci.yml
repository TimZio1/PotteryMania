# Fast checks on every push to `main` — intended as the Railway "Wait for CI" gate.
# Heavy Playwright / pillar runs stay in `qa-pillars.yml` (PR + manual + schedule).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potterymania_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d potterymania_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/potterymania_ci?schema=public"
      AUTH_SECRET: "ci-auth-secret-not-for-production"
      AUTH_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
      CRON_SECRET: "ci-cron-secret"
      RESEND_API_KEY: ""
      RESEND_FROM: "PotteryMania <onboarding@resend.dev>"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate
        run: |
          npx prisma db execute --stdin <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL

          for i in 1 2 3 4 5; do
            npx prisma migrate deploy && exit 0
            echo "Prisma migrate attempt $i failed; retrying in 3s..."
            sleep 3
          done

          echo "Prisma migrate failed after retries."
          exit 1

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:ci
